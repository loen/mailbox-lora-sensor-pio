; Two firmwares in one project:
;   receiver – indoor board: LoRa -> Wi-Fi/MQTT (Home Assistant), OLED
;   sender   – board in the mailbox: reed switch -> LoRa, deep sleep
; plus `native`, which runs the unit tests of lib/mailbox_core on this computer.
;
; Always pick the environment explicitly when uploading, e.g.
;   pio run -e receiver -t upload
;   pio run -e sender -t upload
; Unit tests:
;   pio test -e native

[platformio]
default_envs = receiver, sender

[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = heltec_wifi_lora_32_V2
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_ignore = native/*
lib_deps =
    jgromes/RadioLib@^7.1.2

[env:receiver]
extends = esp32
build_src_filter = +<receiver/>
lib_deps =
    ${esp32.lib_deps}
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
    knolleary/PubSubClient@^2.8

[env:sender]
extends = esp32
build_src_filter = +<sender/>

[env:native]
platform = native
test_framework = unity
test_filter = native/*
; named explicitly: the test fixtures in test/native/support include it, and the
; dependency finder does not look into that directory
lib_deps = mailbox_core
; sanitizers turn memory errors and undefined behaviour in the tested code into test failures
build_flags =
    -std=gnu++17 -Wall -Wextra -Werror
    -I test/native/support
    -pthread
    -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g
